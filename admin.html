<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SANU Report — Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .wrap{max-width:920px;margin:0 auto;padding:28px 22px 120px}
  .admin-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .admin-head h1{font-size:1.7rem}
  .admin-head a{font-family:Cabin;font-weight:600;font-size:13px;text-decoration:none}
  .intro{color:var(--ink-2);font-size:14px;max-width:64ch;margin-bottom:26px}
  fieldset{border:1px solid var(--border);border-radius:14px;padding:18px;margin:0 0 18px;background:var(--surface)}
  legend{font-family:Cabin;font-weight:700;font-size:.95rem;color:var(--display);padding:0 8px}
  .fs-sub{color:var(--muted);font-size:12px;margin:-4px 0 14px;font-family:Cabin;font-weight:500}
  .grid-3{display:grid;grid-template-columns:1fr 110px 110px;gap:8px 12px;align-items:center}
  .grid-2{display:grid;grid-template-columns:1fr 120px;gap:8px 12px;align-items:center}
  .grid-3 .hd,.grid-2 .hd{font-family:Cabin;font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .grid-3 label,.grid-2 label{font-size:13px;color:var(--ink-2)}
  input,textarea{
    font-family:Manrope,sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg);
    border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;width:100%
  }
  input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
  textarea{min-height:96px;resize:vertical;line-height:1.5}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:Cabin;font-weight:600;font-size:12px;color:var(--ink-2);margin-bottom:5px}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .savebar{
    position:sticky;bottom:0;background:var(--header-bg);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:14px 22px;margin:24px -22px -120px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5
  }
  .savebar input{max-width:190px}
  button.primary{
    font-family:Cabin;font-weight:700;font-size:14px;color:#fff;background:var(--crimson);
    border:0;border-radius:9px;padding:11px 22px;cursor:pointer
  }
  button.primary:disabled{opacity:.5;cursor:progress}
  button.ghost{
    font-family:Cabin;font-weight:600;font-size:13px;color:var(--ink-2);background:var(--surface-2);
    border:1px solid var(--border);border-radius:9px;padding:10px 16px;cursor:pointer
  }
  #msg{font-family:Cabin;font-weight:600;font-size:13px}
  #msg.ok{color:var(--good)} #msg.err{color:var(--crimson-ink)}
  .status{font-size:12px;color:var(--muted);font-family:Cabin;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="admin-head">
    <h1>Report data</h1>
    <a href="report.html">← Back to the dashboard</a>
  </div>
  <p class="intro">
    Edit any figure below and press <b>Save</b>. The change is written to the site’s data store and every
    visitor’s dashboard picks it up on next load. <span class="status" id="status">checking store…</span>
  </p>

  <form id="form"></form>

  <div class="savebar">
    <input type="password" id="pass" placeholder="Edit password" autocomplete="current-password" aria-label="Edit password">
    <button class="primary" id="save" type="button">Save to dashboard</button>
    <button class="ghost" id="reload" type="button">Reload current</button>
    <button class="ghost" id="export" type="button">Download data.js</button>
    <span id="msg" role="status"></span>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
