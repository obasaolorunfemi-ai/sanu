# Netlify configuration — static site + one function for the editable data store.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The function declares config.path = "/api/data"; this rewrite is a belt-and-
# braces fallback so the endpoint resolves on every Netlify runtime version.
[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
